name: Keep Floor local

on:
  pull_request:
  push:
    branches: [main]

# A newer push or dispatch on the same ref cancels the older run still queued or in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository to inspect tracked paths; give it that and nothing else.
permissions:
  contents: read

jobs:
  reject-floor-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked Floor source and tapes
        run: python3 tools/check_public_floor_boundary.py
