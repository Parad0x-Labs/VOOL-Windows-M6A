name: CodeQL

# Static security analysis for every language this repo ships: the Python runtime, the C#
# Windows broker and approval host, the TypeScript mobile app and the workflow files
# themselves. Findings land in Security > Code scanning; a ruleset can then make the
# "CodeQL" check block merges on new high-severity alerts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays: catches new CodeQL queries against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          # build-mode none extracts the C# sources without compiling them, so the Windows-only
          # target framework does not need a Windows runner here. The native build itself stays
          # gated by the Windows Source Gauntlet with -warnaserror.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned .NET SDK (global.json)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
