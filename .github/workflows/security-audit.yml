name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday 08:00 UTC
  workflow_dispatch:        # run manually anytime

# Every auditor's exit code is the only status authority here. No continue-on-error, no `|| true`,
# no `|| echo 0`: a crashed auditor must fail this job (UNKNOWN is a failure, never a fabricated
# zero), and any found vulnerability fails it through the tool's own nonzero exit. Dependabot
# remains the fix channel; this workflow is the alarm that surfaces anything Dependabot missed.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"

      - name: Install Python auditor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          mkdir -p .security-audit

      - name: pip-audit (requirements)
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements.txt --format=json -o .security-audit/requirements.json

      - name: pip-audit (runtime requirements)
        if: always()
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements-runtime.txt --format=json -o .security-audit/runtime.json

      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-security-audit
          path: .security-audit/*.json
          include-hidden-files: true
          if-no-files-found: error

      - name: npm audit (only when a package.json exists)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          npm audit --audit-level=moderate

      - name: cargo audit (only when a Cargo.toml exists)
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          cargo audit

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Security Audit — $(date -u +%Y-%m-%d)"
            echo ""
            echo "Auditor exit codes are the only status authority: a crashed auditor fails this job (UNKNOWN), and any found vulnerability fails it."
            echo ""
            echo "Fix channel — Dependabot alerts: https://github.com/Parad0x-Labs/${{ github.event.repository.name }}/security/dependabot"
          } >> "$GITHUB_STEP_SUMMARY"
