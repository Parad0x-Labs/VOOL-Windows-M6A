name: Secret Scan

# Scans only the commits a pull request or push adds, so the gate starts clean on today's
# history. A finding fails the job. Test fixtures that need a fake key-shaped string mark
# that line with a trailing `gitleaks:allow` comment, which keeps every exception visible
# in review instead of hiding a whole directory.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.0"
  # sha256 of gitleaks_8.24.0_linux_x64.tar.gz from the release's checksums file.
  GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the added commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$(git merge-base "$PR_BASE" "$PR_HEAD")..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A new branch has no "before": scan the pushed head commit itself.
            range="-1 $PUSH_AFTER"
          fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 \
            --log-opts="$range" .
