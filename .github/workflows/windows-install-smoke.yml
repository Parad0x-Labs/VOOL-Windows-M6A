name: Windows Install Smoke

# Builds the real Inno Setup installer on a disposable windows-latest runner, installs it,
# launches it the way the desktop shortcut does and proves the lifecycle
# (tools/windows_install_smoke.ps1). It downloads a pinned, hash-verified Ollama release
# (~1.5 GB) and binds 127.0.0.1:11435 on the runner, so it never runs on ordinary pushes.
# A manual dispatch needs the file on the default branch, which this Windows line never
# touches, so the owner-approved way to run it is pushing the commit under test to the one
# dedicated branch below.

on:
  push:
    branches: [windows/install-smoke]
  workflow_dispatch:

concurrency:
  group: windows-install-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not available at $iscc" }
      - name: Build, install, launch, restart and uninstall VOOL
        shell: pwsh
        run: ./tools/windows_install_smoke.ps1
      - name: Upload install smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vool-windows-install-smoke
          path: dist/install-smoke/
          if-no-files-found: warn
