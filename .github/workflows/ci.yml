name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC -- compatibility interpreters
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 35.9k tests on a 2-core hosted runner need far more than the default 30-minute shard deadline.
    timeout-minutes: 360
    # Bounded CI bridge: keep real non-root bwrap probes; never disable host security.
    # Migrate before this hosted image retires on 2027-04-17.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is load-bearing: test_legacy_migration_repair extracts a real ancestor.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          # Push/PR verification is intentionally exact. ops/verify.py rejects any mismatch.
          python-version: "3.12.13"
      - name: Provision Linux confinement (Bubblewrap)
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p .verification-logs
          set +e
          (
            set -e
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
            dpkg-query -W bubblewrap
            bwrap --version
          ) >.verification-logs/confinement-provision.log 2>&1
          status=$?
          cat .verification-logs/confinement-provision.log
          exit "$status"
      - name: Verify Linux confinement
        timeout-minutes: 5
        run: python ops/check_linux_confinement.py --report .verification-logs/confinement.json
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion]"
      - name: Provision the served-browser lane (Playwright chromium)
        # The required served-chat-UI suites fail the authoritative lane when this binary is
        # absent (required-suite gate), so provisioning here is what keeps the lane executed, not skipped.
        run: python -m playwright install --with-deps chromium
      - name: Run authoritative verification
        run: >-
          python ops/verify.py --workers 4 --pytest-arg=--tb=short
          --log-dir=.verification-logs --tail-lines=2000 --timeout-seconds 7200
      - name: Upload complete verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-logs-py3.12.13
          path: .verification-logs/
          include-hidden-files: true
          if-no-files-found: error

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Match the authoritative confinement environment; same migration deadline above.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision Linux confinement (Bubblewrap)
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p .compatibility-logs
          set +e
          (
            set -e
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
            dpkg-query -W bubblewrap
            bwrap --version
          ) >.compatibility-logs/confinement-provision.log 2>&1
          status=$?
          cat .compatibility-logs/confinement-provision.log
          exit "$status"
      - name: Verify Linux confinement
        timeout-minutes: 5
        run: python ops/check_linux_confinement.py --report .compatibility-logs/confinement.json
      - name: Install compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser,companion]"
      - name: Provision the served-browser lane (Playwright chromium)
        # Compatibility is a full-scope (required-suite gate) lane too: required suites execute, never skip.
        run: python -m playwright install --with-deps chromium
      - name: Run compatibility collection and shards
        run: >-
          python ops/pytest_shards.py --workers 4 --pytest-arg=--tb=short
          --tail-lines=2000 --timeout-seconds 7200
          --artifact-root=.compatibility-logs
      - name: Upload complete compatibility logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-logs-py${{ matrix.python-version }}
          path: .compatibility-logs/
          include-hidden-files: true
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        run: python -m build
      - name: Smoke install built wheel
        run: |
          python -m venv /tmp/vool-wheel-venv
          . /tmp/vool-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          cd /tmp
          python -c "import apps.vool_api_server; import apps.brain_hive_watch_server; import core.tool_intent_executor; import tools.registry; import relay.channel_outbound; import installer.register_openclaw_agent; import yaml; import psutil"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
