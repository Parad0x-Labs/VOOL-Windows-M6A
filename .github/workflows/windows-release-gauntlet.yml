name: Windows Release Gauntlet

concurrency:
  group: windows-release-gauntlet-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release-gauntlet.yml"
      - "Install_And_Run_VOOL.ps1"
      - "Install_And_Run_VOOL.bat"
      - "Test_VOOL_Windows_Gauntlet.cmd"
      - "installer/**"
      # Only the core modules this gauntlet's tests actually import. A blanket core/** triggered a
      # 2x-billed Windows runner for routing and context edits that cannot reach the installer
      # surface; ubuntu CI still covers every one of these files on each push, and only
      # test_model_store_planner.py is genuinely win32-gated.
      - "core/hardware_tier.py"
      - "core/install_recommendations.py"
      - "core/local_model_bundles.py"
      - "core/model_store_planner.py"
      - "core/openclaw_locator.py"
      - "core/provider_routing.py"
      - "core/public_hive_bridge.py"
      - "core/runtime_backbone.py"
      - "tools/windows_fresh_host_gauntlet.ps1"
      - "tests/test_hardware_tier.py"
      - "tests/test_model_store_planner.py"
      - "tests/test_provider_probe.py"
      - "tests/test_provider_probe_contract.py"
      - "tests/test_install_script_contract.py"
      - "tests/test_install_surface_contracts.py"
      - "tests/test_local_only_policy.py"
      - "tests/test_validate_install_profile.py"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/windows-release-gauntlet.yml"
      - "Install_And_Run_VOOL.ps1"
      - "Install_And_Run_VOOL.bat"
      - "Test_VOOL_Windows_Gauntlet.cmd"
      - "installer/**"
      # Only the core modules this gauntlet's tests actually import. A blanket core/** triggered a
      # 2x-billed Windows runner for routing and context edits that cannot reach the installer
      # surface; ubuntu CI still covers every one of these files on each push, and only
      # test_model_store_planner.py is genuinely win32-gated.
      - "core/hardware_tier.py"
      - "core/install_recommendations.py"
      - "core/local_model_bundles.py"
      - "core/model_store_planner.py"
      - "core/openclaw_locator.py"
      - "core/provider_routing.py"
      - "core/public_hive_bridge.py"
      - "core/runtime_backbone.py"
      - "tools/windows_fresh_host_gauntlet.ps1"
      - "tests/test_hardware_tier.py"
      - "tests/test_model_store_planner.py"
      - "tests/test_provider_probe.py"
      - "tests/test_provider_probe_contract.py"
      - "tests/test_install_script_contract.py"
      - "tests/test_install_surface_contracts.py"
      - "tests/test_local_only_policy.py"
      - "tests/test_validate_install_profile.py"
  workflow_dispatch:

# These jobs read source and upload run artifacts; repository write access is unnecessary.
permissions:
  contents: read

jobs:
  # The gauntlet runs only for a ref whose open PR is ready for review. A dispatch on a branch
  # whose open PR is still a draft skips the Windows runner. A ref with no open PR (the port
  # branch, an install check) runs as before. If the PR lookup fails, the gauntlet does not run.
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            draft="$PR_DRAFT"
          else
            draft=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --head "$REF_NAME" \
              --json isDraft --jq 'map(.isDraft) | any')
          fi
          if [ "$draft" = "true" ]; then
            echo "Open PR for $REF_NAME is a draft: skipping the gauntlet until it is ready for review."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  gauntlet:
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,companion,evm]"
      - name: Run Windows gauntlet without live model pull
        shell: cmd
        run: Test_VOOL_Windows_Gauntlet.cmd -SkipInstall -SkipBenchmark -Json
      - name: Upload gauntlet report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vool-windows-gauntlet-report
          path: dist/windows-gauntlet/*.json
